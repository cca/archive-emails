[project]
name = "entity-extractor"
version = "0.2.0"
description = "Extract named entities from emails using spaCy NER"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "spacy==3.8.14",
    "rich==15.0.0",
    "click==8.4.2",
    "beautifulsoup4==4.15.0",
    "pdfplumber==0.11.10",
    "requests==2.34.2",
]

[project.scripts]
extract-entities = "entity_extractor.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.ruff.lint]
select = ["A", "E", "F", "I", "N", "Q", "S", "SIM", "T", "W"]
ignore = ["E501", "S101"]
